name: Release

# Cutting a release is one action: push a SemVer tag.
#
#   git tag -a v0.2.0 -m "Live match fixes" && git push origin v0.2.0
#
# A plain triple (v0.2.0) is a stable release: marked Latest, added to the
# changelog, and offered to devices over the air.
#
# Anything with a suffix (v0.2.0-rc1, v0.2.0-beta.2, v0.2.0-alpha1) is a
# pre-release: published with a binary, clearly marked, and deliberately kept
# out of the update manifest. Devices refuse to install pre-releases even if a
# manifest advertises one, so this is belt and braces.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)publish'
        required: true

permissions:
  contents: write   # Create the release, and commit the manifest and changelog.

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Resolve version and stability
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          VERSION="${TAG#v}"

          # Stable means a plain numeric triple and nothing else. This single
          # test decides four things: how the release is labelled, whether it
          # becomes Latest, whether the manifest devices poll is updated, and
          # whether the changelog gains an entry. Keeping it in one place is
          # why those cannot disagree.
          if printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            STABLE=true
          else
            STABLE=false
          fi

          # The previous stable tag, for the change list. Pre-releases are
          # excluded so a release lists everything since the last release
          # people actually received.
          # Matched positively rather than by excluding a dash. `grep -vE -- '-'`
          # relies on `--` ending option parsing, which not every grep handles
          # alike, and a mis-parse here silently produces the wrong commit
          # range and therefore the wrong release notes.
          PREV=$(git tag -l --sort=-v:refname \
                 | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                 | grep -v "^${TAG}$" | head -1)

          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "stable=$STABLE"   >> "$GITHUB_OUTPUT"
          echo "prev=$PREV"       >> "$GITHUB_OUTPUT"
          echo "Tag $TAG -> version $VERSION (stable: $STABLE, previous: ${PREV:-none})"

      # VERSION is deliberately NOT written here. It is only a fallback for
      # builds with no git metadata, and the runner has full history, so
      # writing it buys nothing — while editing a tracked file before the build
      # makes `git describe --dirty` report "-dirty". That is how v0.2.0 came
      # to publish a binary whose build slug read "0.2.0+dirty". The manifest
      # step later writes it on main, which is where it belongs.

      - name: Refuse to build a dirty tree
        # The build stamps itself from `git describe --dirty`, so anything
        # that edits a tracked file before this point silently mislabels the
        # artefact. Cheap to check, and the failure it prevents is invisible
        # until someone reads the version on a device.
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::working tree is not clean at build time; the"
            echo "::error::firmware would be stamped +dirty. Offending paths:"
            git status --porcelain
            exit 1
          fi
          echo "clean: $(git describe --tags --dirty --always)"

      - name: Build
        run: pio run -e cyd

      - name: Verify the binary reports the tagged version
        # A binary that misreports its own version makes OTA comparisons
        # meaningless — devices would refuse a real update, or reinstall the
        # same one forever. Better to fail the release than ship it.
        run: |
          EXPECTED="${{ steps.version.outputs.version }}"

          # -a matters. Without it grep treats firmware.bin as binary, and the
          # exit status for a match is not consistent between GNU grep (0, as
          # the runner has) and BSD grep (1, as macOS has). A check that
          # silently inverts depending on where it runs is worse than none, and
          # this one is the last line of defence before a release ships.
          if ! grep -aqF "$EXPECTED" .pio/build/cyd/firmware.bin; then
            echo "::error::firmware does not contain version string $EXPECTED"
            exit 1
          fi
          # Belt and braces against the dirty-tree case above: a released
          # binary must never carry a build slug saying it came from an edited
          # working copy, which is what v0.2.0 shipped.
          if grep -aqF "${EXPECTED}+dirty" .pio/build/cyd/firmware.bin; then
            echo "::error::firmware is stamped ${EXPECTED}+dirty"
            exit 1
          fi
          # The OTA default must survive into the image, or a freshly flashed
          # device never looks for updates.
          if ! grep -aqF "manifest.json" .pio/build/cyd/firmware.bin; then
            echo "::error::firmware carries no OTA manifest URL"
            exit 1
          fi
          if [ "${{ steps.version.outputs.stable }}" = "true" ] \
             && printf '%s' "$EXPECTED" | grep -q -- '-'; then
            echo "::error::marked stable but the version carries a suffix"
            exit 1
          fi
          echo "Binary reports $EXPECTED"

      - name: Assemble artefacts
        id: artefacts
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          REPO="${GITHUB_REPOSITORY}"
          BIN="firmware-${VERSION}.bin"

          cp .pio/build/cyd/firmware.bin "$BIN"
          SHA=$(sha256sum "$BIN" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$BIN")

          # A sidecar in the format `shasum -c` expects, so anyone can verify a
          # download with one command rather than comparing strings by eye.
          echo "${SHA}  ${BIN}" > "${BIN}.sha"

          mkdir -p firmware
          cat > firmware/manifest.json <<JSON
          {
            "version": "$VERSION",
            "url": "https://github.com/$REPO/releases/download/$TAG/$BIN",
            "size": $SIZE,
            "sha256": "$SHA",
            "released": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON

          echo "sha=$SHA"     >> "$GITHUB_OUTPUT"
          echo "size=$SIZE"   >> "$GITHUB_OUTPUT"
          echo "bin=$BIN"     >> "$GITHUB_OUTPUT"
          cat "${BIN}.sha"

      - name: Build the change list
        id: changes
        run: |
          PREV="${{ steps.version.outputs.prev }}"
          TAG="${{ steps.version.outputs.tag }}"

          if [ -n "$PREV" ]; then
            RANGE="${PREV}..${TAG}"
          else
            RANGE="$TAG"
          fi

          # Commit subjects, as bullets. Merge commits are dropped because they
          # restate the branch they merged, and the branch's own commit already
          # says what changed.
          #
          # tformat, not format. `--pretty=format:` omits the trailing newline
          # after the final entry, which glues the heredoc delimiter onto the
          # last commit subject:
          #
          #   - fix: some commit subjectCHANGES_EOF
          #
          # GitHub then never finds the delimiter and the step fails with an
          # invalid format error that says nothing about newlines. tformat
          # terminates every entry instead of separating them.
          git log --no-merges --pretty=tformat:'- %s' "$RANGE" > /tmp/changes.md || true
          if [ ! -s /tmp/changes.md ]; then
            printf -- '- No changes recorded\n' > /tmp/changes.md
          fi
          # Belt and braces: guarantee a final newline whatever produced the
          # file, since the failure mode is silent and confusing.
          [ -n "$(tail -c1 /tmp/changes.md)" ] && printf '\n' >> /tmp/changes.md

          echo "Changes in $RANGE:"
          cat /tmp/changes.md

          {
            echo 'list<<CHANGES_EOF'
            cat /tmp/changes.md
            echo 'CHANGES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish a stable release
        if: steps.version.outputs.stable == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: v${{ steps.version.outputs.version }}
          prerelease: false
          make_latest: true
          files: |
            ${{ steps.artefacts.outputs.bin }}
            ${{ steps.artefacts.outputs.bin }}.sha
            firmware/manifest.json
          body: |
            ✅ **Stable release.** Offered to devices over the air.

            ### Changes

            ${{ steps.changes.outputs.list }}

            ### Install

            Devices checking for updates will offer this on the **System**
            page; installing always needs a button press. To flash manually:

            ```
            esptool --port /dev/ttyUSB0 --baud 115200 \
              write-flash 0x10000 ${{ steps.artefacts.outputs.bin }}
            ```

            Verify the download first if you like:

            ```
            shasum -a 256 -c ${{ steps.artefacts.outputs.bin }}.sha
            ```

            | | |
            |---|---|
            | Size | ${{ steps.artefacts.outputs.size }} bytes |
            | SHA-256 | `${{ steps.artefacts.outputs.sha }}` |

            Published binaries contain **no API keys** — enter your own on the
            device's Settings page.

      - name: Publish a pre-release
        if: steps.version.outputs.stable != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: v${{ steps.version.outputs.version }}
          prerelease: true
          make_latest: false
          # The manifest is deliberately not attached. Publishing one here
          # would invite someone to point a device at it, which is exactly what
          # this separation prevents.
          files: |
            ${{ steps.artefacts.outputs.bin }}
            ${{ steps.artefacts.outputs.bin }}.sha
          body: |
            ⚠️ **Pre-release. Not distributed over the air.**

            Devices only install plain numbered releases, and the firmware
            refuses a pre-release even if a manifest advertises one. Install
            this deliberately: upload the `.bin` from the System page, or flash
            over USB.

            ### Changes

            ${{ steps.changes.outputs.list }}

            | | |
            |---|---|
            | Size | ${{ steps.artefacts.outputs.size }} bytes |
            | SHA-256 | `${{ steps.artefacts.outputs.sha }}` |

      # There is deliberately no step committing anything back to main.
      #
      # The manifest ships as an asset of the release itself, and devices poll
      # "releases/latest/download/manifest.json", which GitHub resolves to the
      # newest non-prerelease. So the release *is* the distribution, and the
      # manifest cannot disagree with the binary it describes.
      #
      # This replaced a step that pushed firmware/manifest.json to main. That
      # push was refused by the branch ruleset — github-actions[bot] is not a
      # repository admin and its commit carries no status check — and GitHub
      # offers no way to add Actions to that ruleset's bypass list on this
      # repository. The result was a release that published cleanly and then
      # reached nobody.
      #
      # CHANGELOG.md is now updated in the pull request *before* tagging, with
      #   python3 tools/update_changelog.py <version> <changes file>
      # which keeps this workflow read-only with respect to the repository and
      # puts the changelog under review like everything else. See
      # docs/RELEASING.md.
