name: Feature request
description: Suggest something the tracker should do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like it to do?
      description: Describe the outcome rather than the implementation, if you can.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why would that be useful?
      description: What does it let you do that you cannot do now?

  - type: dropdown
    id: cost
    attributes:
      label: Would it need more API requests?
      description: |
        api-sports allows 100 a day, which is the project's tightest
        constraint. football-data.org has no daily cap.
      options:
        - "No idea"
        - "No — display or interface only"
        - "Yes — from football-data.org (free)"
        - "Yes — from api-sports (limited)"

  - type: textarea
    id: extra
    attributes:
      label: Anything else
