; ESP32 Football Tracker — PlatformIO configuration
;
; Target: ESP32-2432S028R "Cheap Yellow Display" 2.8"
; See docs/HARDWARE.md for the verified hardware details behind these choices.

[env:cyd]
platform  = espressif32@6.13.0
board     = esp32dev
framework = arduino

; --- Serial ---------------------------------------------------------------
; Pinned to 115200. The CH340 bridge on the verified unit corrupts transfers
; at 460800 ("Invalid head of packet"), so do not raise these without
; re-testing on real hardware. See docs/HARDWARE.md §2.
monitor_speed = 115200
upload_speed  = 115200
monitor_filters = esp32_exception_decoder, time

; Match the port by pattern rather than by name. The CH340 enumerates as
; /dev/cu.usbserial-<digits> on macOS, and the digits encode the USB hub port,
; so they change if the board is replugged elsewhere — this board has already
; moved from usbserial-2130 to usbserial-130 mid-session. A glob survives that;
; a hardcoded name means a confusing "port doesn't exist" failure.
upload_port  = /dev/cu.usbserial*
monitor_port = /dev/cu.usbserial*

; --- Flash / filesystem ---------------------------------------------------
; LittleFS rather than SPIFFS: power-fail safe and wear-levelled, where SPIFFS
; is deprecated and corrupts on brownout. The partition keeps the stock
; "spiffs" label because that is the label Arduino's LittleFS driver looks for
; by default; only the format differs.
board_build.filesystem     = littlefs
board_build.partitions     = partitions.csv
board_build.flash_mode     = dio
board_build.f_flash         = 40000000L

; Injects FIRMWARE_VERSION and FIRMWARE_BUILD from the git tag, so cutting a
; release means tagging and nothing else. See tools/inject_version.py.
extra_scripts = pre:tools/inject_version.py

build_flags =
  ; ---- Project ----------------------------------------------------------
  ; Debug level 1 keeps ESP-IDF *error* logs and drops info and above.
  ;
  ; Measured against the 1280KB app partition: level 3 uses 88.0%, level 1
  ; 87.8%, and level 0 85.3%. So the meaningful saving is the last step, worth
  ; 35.6KB, because level 1 still carries the error-logging machinery and its
  ; format strings across the whole IDF.
  ;
  ; Level 1 is chosen anyway: those library error lines found several real
  ; bugs during development (a reset-by-peer that exposed a truncated HTTP
  ; response, a Wi-Fi association failure, NVS misses), and our own logging is
  ; plain Serial.printf which survives any level. Level 0 is held in reserve
  ; if flash ever genuinely runs short.
  -D CORE_DEBUG_LEVEL=1

  ; ---- TFT_eSPI configuration -------------------------------------------
  ; Configured entirely through build flags so the library folder is never
  ; edited. USER_SETUP_LOADED tells TFT_eSPI to skip its own User_Setup.h.
  -D USER_SETUP_LOADED=1
  -D ILI9341_2_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320

  ; Bring-up on real hardware showed every colour as its exact complement
  ; (green rendered magenta, blue rendered yellow, white rendered black).
  ; That is a panel inversion mismatch, NOT a channel-order problem: a BGR
  ; panel swaps red and blue only and leaves white untouched. This unit's
  ; panel powers up inverted relative to what the ILI9341 init expects, so
  ; TFT_eSPI is told to issue INVON. See docs/HARDWARE.md.
  -D TFT_INVERSION_ON=1

  ; Display SPI pins — HSPI's native pins on this board, so no GPIO matrix
  ; routing penalty. The panel has no reset line of its own (tied to the
  ; board reset), hence TFT_RST=-1.
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D USE_HSPI_PORT=1

  ; TOUCH_CS is deliberately NOT defined, so TFT_eSPI prints a warning that its
  ; touch functions are unavailable. That is intended: TFT_eSPI's touch support
  ; assumes the controller shares the display's SPI bus, which is not true on
  ; this board — touch has its own pins and its own peripheral. Defining
  ; TOUCH_CS to "fix" the warning would produce a touch driver talking on the
  ; wrong bus. We drive the XPT2046 ourselves; see src/touch_input.cpp.

  ; Backlight is driven by our own LEDC channel for dimming (see power plan),
  ; so TFT_eSPI is told the pin but not asked to manage it.
  -D TFT_BL=21
  -D TFT_BACKLIGHT_ON=HIGH

  ; Fonts: the smooth/vector fonts are omitted deliberately — they cost flash
  ; and RAM we would rather spend on cache. Font 2 (small) and Font 4 (medium)
  ; cover the UI; Font 7 is the seven-segment face used for scorelines.
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D LOAD_FONT7=1

  ; 40 MHz SPI. The panel tolerates 55-80 MHz but 40 MHz is the flash clock
  ; this board boots at and is comfortably within spec; the display is not our
  ; bottleneck and a lower clock draws less power (rule R5).
  -D SPI_FREQUENCY=40000000
  -D SPI_READ_FREQUENCY=6000000

; The XPT2046 touch controller is driven by our own ~60-line implementation in
; src/touch_input.cpp rather than a library. The protocol is four register
; reads, and rolling it ourselves drops a dependency, saves flash, and lets us
; use the hardware IRQ line for press detection instead of polling over SPI —
; which matters because that same line is the deep-sleep wake source.
; Optional: narrow the fixture-screen name columns at build time, so the
; scrolling long-name path can be exercised with whatever clubs happen to be
; on screen. Without it a fixture of two short names would leave the animation
; untested. Not set for normal builds.
;
;   PLATFORMIO_BUILD_FLAGS="-DMARQUEE_SQUEEZE=50" pio run --target upload

lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  ; ArduinoJson v7 for its streaming parser and deserialisation filters, which
  ; are what make a ~100KB standings response parseable on a board whose
  ; largest contiguous heap block is around 112KB.
  bblanchon/ArduinoJson@^7.2.0
  ; PNGdec decodes a line at a time with a callback, which is what lets a
  ; 70x70 RGBA crest be scaled and stored without ever holding a full decoded
  ; image. Crests are PNG because that is what the provider serves.
  bitbank2/PNGdec@^1.0.1
